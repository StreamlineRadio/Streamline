name: Nightly

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute metadata
        id: meta
        run: |
          # Short commit SHA kept for the release title (human-readable identity)
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Version uses run_number so all components are integers (required by Windows PE resedit)
          echo "version=0.0.1-nightly.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog since last stable tag
        run: |
          # Newest stable tag (vX.Y.Z); empty if none exists yet
          last_tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            # Diff from the last stable release up to HEAD
            npx --yes git-cliff@latest "${last_tag}..HEAD" --output NIGHTLY_NOTES.md
          else
            # No stable release yet: changelog over full history
            npx --yes git-cliff@latest --output NIGHTLY_NOTES.md
          fi

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: nightly-changelog
          path: NIGHTLY_NOTES.md

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: nightly
      upload-artifacts: true

  release:
    name: Publish nightly release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: nightly-changelog

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Reset nightly draft release
        run: |
          # Delete the old release AND its tag (now that immutability is off this should succeed)
          # Draft releases don't have a git tag, so --cleanup-tag is a no-op for those
          gh release delete latest-nightly --cleanup-tag --yes || true
          # Create a fresh draft — drafts do NOT create a git tag, bypassing any tag-creation ruleset
          gh release create latest-nightly \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly #${{ github.run_number }} (${{ needs.prepare.outputs.short_sha }})" \
            --notes-file NIGHTLY_NOTES.md

      - name: Upload artifacts to draft release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: latest-nightly
          draft: true
          make_latest: false
          files: release-artifacts/**/*

      - name: Publish nightly release
        run: |
          # Publishing creates the git tag via the Releases API, not a git push
          # This may succeed even when direct git tag pushes are blocked by a ruleset
          gh release edit latest-nightly --draft=false
