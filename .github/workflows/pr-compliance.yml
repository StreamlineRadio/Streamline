name: PR Compliance

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  check-description:
    name: PR description
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const passed = (pr.body || '').trim().length > 0;
            core.setOutput('passed', passed);
            if (!passed) core.setFailed('PR description is empty');

  check-conventional-commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const CC_REGEX = /^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\(.+\))?(!)?: .+/;
            const SKIP_REGEX = /^(Merge |fixup! |squash! )/;

            const bad = [];
            for (const { commit, sha } of commits) {
              const firstLine = commit.message.split('\n')[0];
              if (!SKIP_REGEX.test(firstLine) && !CC_REGEX.test(firstLine)) {
                bad.push(`- \`${sha.slice(0, 7)}\` ${firstLine}`);
              }
            }

            const passed = bad.length === 0;
            core.setOutput('passed', passed);
            if (!passed) {
              core.setOutput('detail', [
                'The following commits need to be reformatted:',
                bad.join('\n'),
                '',
                'Valid formats: `feat: add thing`, `fix(scope): correct bug`, `chore!: breaking change`',
                'See [conventionalcommits.org](https://www.conventionalcommits.org/) for the full spec.',
              ].join('\n'));
              core.setFailed('Some commits do not follow Conventional Commits');
            }

  check-dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
      detail: ${{ steps.check.outputs.detail }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const { data: commits } = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const SKIP_REGEX = /^(Merge |fixup! |squash! )/;

            const bad = [];
            for (const { commit, sha } of commits) {
              const firstLine = commit.message.split('\n')[0];
              if (!SKIP_REGEX.test(firstLine) && !commit.message.includes('Signed-off-by:')) {
                bad.push(`- \`${sha.slice(0, 7)}\` ${firstLine}`);
              }
            }

            const passed = bad.length === 0;
            core.setOutput('passed', passed);
            if (!passed) {
              core.setOutput('detail', [
                'The following commits are missing a `Signed-off-by:` line:',
                bad.join('\n'),
                '',
                'Streamline is dual-licensed — every commit needs a DCO sign-off. Add it with:',
                '```',
                'git commit -s -m "your message"',
                '```',
                'To fix existing commits on this branch:',
                '```',
                `git rebase --signoff HEAD~${bad.length} && git push --force-with-lease`,
                '```',
              ].join('\n'));
              core.setFailed('Some commits are missing DCO sign-off');
            }

  report:
    name: Report results
    needs: [check-description, check-conventional-commits, check-dco]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          DESC_PASSED: ${{ needs.check-description.outputs.passed }}
          CC_PASSED: ${{ needs.check-conventional-commits.outputs.passed }}
          CC_DETAIL: ${{ needs.check-conventional-commits.outputs.detail }}
          DCO_PASSED: ${{ needs.check-dco.outputs.passed }}
          DCO_DETAIL: ${{ needs.check-dco.outputs.detail }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const MARKER = '<!-- streamline-pr-compliance -->';
            const CONTRIBUTING_URL = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md`;

            const failures = [];

            if (process.env.DESC_PASSED !== 'true') {
              failures.push({
                title: 'PR description is empty',
                detail: 'Please add a description explaining **what** changed and **why**.',
              });
            }
            if (process.env.CC_PASSED !== 'true') {
              failures.push({
                title: 'Commits do not follow Conventional Commits',
                detail: process.env.CC_DETAIL,
              });
            }
            if (process.env.DCO_PASSED !== 'true') {
              failures.push({
                title: 'Missing DCO sign-off',
                detail: process.env.DCO_DETAIL,
              });
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(MARKER));

            if (failures.length === 0) {
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: `${MARKER}\n✅ All compliance checks are now passing — thanks for updating your PR!`,
                });
              }
              return;
            }

            const body = [
              MARKER,
              '## Contribution Guideline Issues',
              '',
              `This PR doesn't meet the [contribution guidelines](${CONTRIBUTING_URL}) yet. Please fix the following before requesting review:`,
              '',
              ...failures.map(f => `### ❌ ${f.title}\n\n${f.detail}`),
              '',
              '---',
              '',
              '> **Note on AI use:** If AI tools assisted with this PR, please disclose that in your description per the guidelines.',
              '',
              '*This comment is updated automatically on each push.*',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            core.setFailed(`PR compliance failed: ${failures.map(f => f.title).join(', ')}`);